services:
  # ── 1. Student Service ────────────────────────────────────────────────────────
  - type: web
    name: jobsync-student-service
    runtime: node
    branch: Draxh
    rootDir: services/student-service
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    healthCheckPath: /health
